<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" role="img" aria-labelledby="title desc">
  <title id="title">From real-time 3D to interactive worlds</title>
  <desc id="desc">A dark blue banner with a geometric world grid, connecting real-time 3D engineering and interactive world models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#142640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#71e0cf"/>
      <stop offset="1" stop-color="#8abaff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3d81b3" stop-opacity=".27"/>
      <stop offset="1" stop-color="#3d81b3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="286" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
